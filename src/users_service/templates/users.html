<!DOCTYPE html>
<html>
<head>
    <title>Usuarios</title>
</head>
<body>
    <h1>Usuarios</h1>
    {% if users %}
        <ul>
        {% for user in users %}
            <li>{{ user.id }}: {{ user.name }}</li>
        {% endfor %}
        </ul>
    {% else %}
        <p>No hay usuarios registrados.</p>
    {% endif %}
</body>
</html>
