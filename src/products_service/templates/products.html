<!DOCTYPE html>
<html>
<head>
    <title>Productos</title>
</head>
<body>
    <h1>Productos</h1>
    {% if products %}
        <ul>
        {% for product in products %}
            <li>{{ product.id }}: {{ product.name }} - ${{ product.price }}</li>
        {% endfor %}
        </ul>
    {% else %}
        <p>No hay productos registrados.</p>
    {% endif %}
</body>
</html>
